<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function () {
  try {
    var stored = localStorage.getItem("theme");
    if (stored === "light" || stored === "dark") {
      document.documentElement.setAttribute("data-theme", stored);
    }
  } catch (e) {}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="view-transition" content="same-origin">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ site.base_url }}{{ path }}">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ site.base_url }}{{ path }}">
<meta property="og:image" content="{{ og_image or (site.base_url + '/og-default.png') }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ title }}">
<meta name="twitter:description" content="{{ description }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.name }}" href="/rss.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/global.css">
</head>
<body>
<a class="visually-hidden" href="#main" style="position:absolute;left:-9999px;">Skip to content</a>
<div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">Miguel Luzes</a>
    <nav class="nav" data-nav>
      <div class="nav-links">
        <a href="/projects/" {% if section=='projects' %}aria-current="page"{% endif %}>Projects</a>
        <a href="/blog/" {% if section=='blog' %}aria-current="page"{% endif %}>Blog</a>
        <a href="/cv/" {% if section=='cv' %}aria-current="page"{% endif %}>CV</a>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" type="button">
        <span data-theme-icon="light" style="display:inline-flex;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </span>
        <span data-theme-icon="dark" style="display:inline-flex;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
    </nav>
    <button class="mobile-nav-toggle" data-nav-toggle aria-label="Open menu" aria-expanded="false" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </div>
</header>

<main id="main">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <div class="footer-links">
      <a href="{{ site.github }}">GitHub</a>
      <a href="{{ site.linkedin }}">LinkedIn</a>
      {% if site.letterboxd %}<a href="{{ site.letterboxd }}">Letterboxd</a>{% endif %}
      <a href="/rss.xml">RSS</a>
      <a href="/uses/">Uses</a>
    </div>
    <div class="footer-copy">&copy; {{ year }} Miguel Luzes</div>
  </div>
</footer>

<script src="/js/theme.js"></script>
<script src="/js/reveal.js"></script>
<script src="/js/hero.js"></script>
</body>
</html>
